name: Coletar editais do PNCP

on:
  schedule:
    # 01:46 (principal), 03:46 e 05:46 (reforcos) em Brasilia = 04:46, 06:46 e 08:46 UTC (o cron do GitHub e sempre em UTC).
    # Os reforcos so rodam se nenhuma coleta agendada tiver terminado com sucesso no dia (ver job "verificar").
    - cron: "46 4 * * *"
    - cron: "46 6 * * *"
    - cron: "46 8 * * *"
  workflow_dispatch:
    inputs:
      uf:
        description: "UFs separadas por virgula (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: coletar-editais
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      executar: ${{ steps.d.outputs.executar }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          export TZ=America/Sao_Paulo
          inicio="$(date -d "$(date +%F) 00:00" -u +%Y-%m-%dT%H:%M:%SZ)"
          feitas="$(gh run list -R "$GITHUB_REPOSITORY" --workflow coletar.yml --status success --limit 30 --json databaseId,createdAt,event --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .event == \"schedule\" and .createdAt >= \"$inicio\")] | length")"
          if [ "$EVENTO" = "schedule" ] && [ "${feitas:-0}" != "0" ]; then echo "executar=false" >> "$GITHUB_OUTPUT"; else echo "executar=true" >> "$GITHUB_OUTPUT"; fi

  coletar:
    needs: verificar
    if: needs.verificar.outputs.executar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô
        timeout-minutes: 110
        env:
          TZ: America/Sao_Paulo
          UFS: ${{ github.event.inputs.uf }}
        run: |
          if [ -n "$UFS" ]; then
            python3 robo/coletar_editais.py --uf "$UFS"
          else
            python3 robo/coletar_editais.py
          fi

      - name: Publicar os dados no repositório
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "robo-editais"
          git config user.email "robo-editais@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git commit -m "dados: coleta PNCP $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          # Se alguem enviou algo ao ramo durante a coleta, atualiza e tenta de novo
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando 5 segundos"
            sleep 5
          done
          echo "Não foi possível publicar os dados" >&2
          exit 1
