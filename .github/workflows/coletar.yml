name: Coletar editais do PNCP

on:
  schedule:
    # 01:07, 03:07 e 05:07 em Brasilia (04:07, 06:07 e 08:07 UTC). Se uma falhar, a seguinte cobre.
    - cron: "7 4 * * *"
    - cron: "7 6 * * *"
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      uf:
        description: "UFs separadas por virgula (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: coletar-editais
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô
        env:
          TZ: America/Sao_Paulo
          UFS: ${{ github.event.inputs.uf }}
        run: |
          if [ -n "$UFS" ]; then
            python3 robo/coletar_editais.py --uf "$UFS"
          else
            python3 robo/coletar_editais.py
          fi

      - name: Publicar os dados no repositório
        run: |
          git config user.name  "robo-editais"
          git config user.email "robo-editais@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git commit -m "dados: coleta PNCP $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          # Se alguem enviou algo ao ramo durante a coleta, atualiza e tenta de novo
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando 5 segundos"
            sleep 5
          done
          echo "Não foi possível publicar os dados" >&2
          exit 1
